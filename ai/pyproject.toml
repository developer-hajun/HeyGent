[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heygent-ai-backbone"
version = "0.1.0"
description = "HeyGent AI backbone prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "websockets>=12.0,<16.0",
  "pydantic>=2.7,<3.0",
  "prompt_toolkit>=3.0,<4.0",
  "wcwidth>=0.2,<1.0",
  "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
heygent = "app.heygent:main"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tmp*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
