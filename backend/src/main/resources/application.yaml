spring:
  application:
    name: heygent
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/heygent}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

memory:
  embedding:
    enabled: ${MEMORY_EMBEDDING_ENABLED:true}
    base-url: ${MEMORY_EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${MEMORY_EMBEDDING_API_KEY:}
    model: ${MEMORY_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${MEMORY_EMBEDDING_DIMENSIONS:1536}
    timeout-seconds: ${MEMORY_EMBEDDING_TIMEOUT_SECONDS:10}
